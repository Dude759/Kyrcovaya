  <text x="1060" y="406" text-anchor="middle" font-size="14" fill="#61707e">O02</text>
  <text x="1060" y="430" text-anchor="middle" font-size="21" fill="#18232e">Управлять станциями и портами</text>
</g>
  <g id="O03">
  <ellipse cx="1060" cy="505" rx="235" ry="36" fill="white" stroke="#24303b" stroke-width="1.8"/>
  <text x="1060" y="496" text-anchor="middle" font-size="14" fill="#61707e">O03</text>
  <text x="1060" y="520" text-anchor="middle" font-size="21" fill="#18232e">Контролировать сессии</text>
</g>
  <g id="O04">
  <ellipse cx="1060" cy="595" rx="235" ry="36" fill="white" stroke="#24303b" stroke-width="1.8"/>
  <text x="1060" y="586" text-anchor="middle" font-size="14" fill="#61707e">O04</text>
  <text x="1060" y="610" text-anchor="middle" font-size="21" fill="#18232e">Задать лимиты мощности</text>
</g>
  <g id="O05">
  <ellipse cx="1060" cy="685" rx="235" ry="36" fill="white" stroke="#24303b" stroke-width="1.8"/>
