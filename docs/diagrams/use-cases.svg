    <path d="M 1474 433 L 1295 595"/>
    <path d="M 1474 433 L 1295 685"/>
    <path d="M 1474 433 L 1295 775"/>
    <path d="M 1474 433 L 1295 865"/>
  </g>
  <g id="C01">
  <ellipse cx="800" cy="200" rx="235" ry="36" fill="white" stroke="#24303b" stroke-width="1.8"/>
  <text x="800" y="191" text-anchor="middle" font-size="14" fill="#61707e">C01</text>
  <text x="800" y="215" text-anchor="middle" font-size="21" fill="#18232e">Войти в систему</text>
</g>
  <g id="D01">
  <ellipse cx="540" cy="325" rx="235" ry="36" fill="white" stroke="#24303b" stroke-width="1.8"/>
  <text x="540" y="316" text-anchor="middle" font-size="14" fill="#61707e">D01</text>
  <text x="540" y="340" text-anchor="middle" font-size="21" fill="#18232e">Зарегистрироваться</text>
</g>
  <g id="D02">
  <ellipse cx="540" cy="415" rx="235" ry="36" fill="white" stroke="#24303b" stroke-width="1.8"/>
  <text x="540" y="406" text-anchor="middle" font-size="14" fill="#61707e">D02</text>
  <text x="540" y="430" text-anchor="middle" font-size="21" fill="#18232e">Найти совместимую станцию</text>
</g>
  <g id="D03">
  <ellipse cx="540" cy="505" rx="235" ry="36" fill="white" stroke="#24303b" stroke-width="1.8"/>
  <text x="540" y="496" text-anchor="middle" font-size="14" fill="#61707e">D03</text>
  <text x="540" y="520" text-anchor="middle" font-size="21" fill="#18232e">Забронировать и оплатить</text>
</g>
  <g id="D04">
  <ellipse cx="540" cy="595" rx="235" ry="36" fill="white" stroke="#24303b" stroke-width="1.8"/>
  <text x="540" y="586" text-anchor="middle" font-size="14" fill="#61707e">D04</text>
  <text x="540" y="610" text-anchor="middle" font-size="21" fill="#18232e">Просмотреть / отменить бронь</text>
</g>
