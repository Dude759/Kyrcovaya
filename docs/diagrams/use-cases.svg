  <text x="1060" y="700" text-anchor="middle" font-size="21" fill="#18232e">Получить прогноз нагрузки</text>
</g>
  <g id="O06">
  <ellipse cx="1060" cy="775" rx="235" ry="36" fill="white" stroke="#24303b" stroke-width="1.8"/>
  <text x="1060" y="766" text-anchor="middle" font-size="14" fill="#61707e">O06</text>
  <text x="1060" y="790" text-anchor="middle" font-size="21" fill="#18232e">Перевести объект в сервис</text>
</g>
  <g id="O07">
  <ellipse cx="1060" cy="865" rx="235" ry="36" fill="white" stroke="#24303b" stroke-width="1.8"/>
  <text x="1060" y="856" text-anchor="middle" font-size="14" fill="#61707e">O07</text>
  <text x="1060" y="880" text-anchor="middle" font-size="21" fill="#18232e">Организация и оповещения</text>
</g>
  <g aria-label="Водитель" fill="none" stroke="#24303b" stroke-width="2.5" stroke-linecap="round">
  <circle cx="90" cy="384" r="20"/>
  <path d="M 90 404 V 473 M 54 433 H 126 M 90 473 L 61 516 M 90 473 L 119 516"/>
  <text x="90" y="551" text-anchor="middle" font-size="23" stroke="none" fill="#18232e">Водитель</text>
</g>
  <g aria-label="Оператор" fill="none" stroke="#24303b" stroke-width="2.5" stroke-linecap="round">
  <circle cx="1510" cy="384" r="20"/>
  <path d="M 1510 404 V 473 M 1474 433 H 1546 M 1510 473 L 1481 516 M 1510 473 L 1539 516"/>
  <text x="1510" y="551" text-anchor="middle" font-size="23" stroke="none" fill="#18232e">Оператор</text>
</g>
  <text x="800" y="1001" text-anchor="middle" font-size="17" fill="#61707e">Целевая модель · линии показывают участие акторов · оператор получает аккаунт служебным способом</text>
</g>
</svg>
