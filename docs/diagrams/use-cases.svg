  <text x="540" y="676" text-anchor="middle" font-size="14" fill="#61707e">D05</text>
  <text x="540" y="700" text-anchor="middle" font-size="21" fill="#18232e">Начать / завершить зарядку</text>
</g>
  <g id="D06">
