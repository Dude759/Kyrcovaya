name: ML readiness checks
on:
  push:
    branches: [main, 'codex/**']
    paths: ['ml/**', '.github/workflows/ml.yml']
  pull_request:
    paths: ['ml/**', '.github/workflows/ml.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.14.5'
      - run: python -m readiness prepare
      - run: "python -m pip install --only-binary=:all: -r requirements-model.txt"
      - run: python -m unittest discover -s tests -v
      - name: Verify deterministic tracked artifacts
        run: git diff --exit-code -- results
  model:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.14.5'
      - run: "python -m pip install --only-binary=:all: -r requirements-model.txt"
      - run: python -m model.train verify --retrain
      - run: python -m unittest discover -s tests -v
      - name: Preserve versioned trusted model and metrics
        uses: actions/upload-artifact@v4
        with:
          name: rf-synthetic-v1-${{ matrix.os }}
          path: ml/models/rf-v1
      - run: git diff --exit-code -- models results
